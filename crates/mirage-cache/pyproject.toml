# Per-crate pyproject for `maturin develop`.
#
# The Mirage workspace's top-level pyproject.toml describes the pure-Python
# `mirage-runtime` package (hatchling). This file is the maturin-side build
# config for the `mirage_cache._native` extension module specifically — it
# does not replace the workspace pyproject, it complements it. `maturin
# develop --manifest-path crates/mirage-cache/Cargo.toml` picks this up.

[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "mirage-cache"
version = "0.0.1"
description = "Paged latent cache for world-model serving — Rust core with PyO3 bindings."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mirage" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[tool.maturin]
# Build into the mirage_cache._native module so the Python wrapper at
# src/mirage/runtime/latent_cache.py can do `from mirage_cache._native import ...`.
# `python-source` is the mixed-Python/Rust layout: `python/mirage_cache/` is
# the package, `_native` is the PyO3 extension submodule.
module-name = "mirage_cache._native"
python-source = "python"
# pyo3 + abi3 — one wheel per Python >= 3.11.
features = ["pyo3/extension-module"]
