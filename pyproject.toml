[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirage-runtime"
version = "0.0.1"
description = "Mirage Runtime — a world-model-native inference engine. MI300x-first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mirage" }]
keywords = ["world-models", "inference", "diffusion", "rocm", "mi300x", "cosmos"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "typing-extensions>=4.11",
]

[project.optional-dependencies]
# NOTE: torch is intentionally NOT listed here. It must be installed from the
# ROCm wheel index, never PyPI (PyPI torch is CUDA-only). See README "Setup".
models = [
  "transformers>=4.44",
  "diffusers>=0.31",
  "huggingface-hub>=0.25",
  "accelerate>=0.34",  # required by diffusers for low_cpu_mem_usage loading
  "torchvision>=0.22",  # diffusers' Cosmos transformer needs transforms.functional
  "einops>=0.8",
  "safetensors>=0.4",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]
serving = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "grpcio>=1.66",
]
# NVIDIA Cosmos safety guardrail. Required for deployment under the NVIDIA Open
# Model License; install with `pip install -e ".[guardrail]"`.
guardrail = [
  "cosmos-guardrail>=0.3",
]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",  # required by fastapi.testclient.TestClient
  # Rust ↔ Python build tool. `make rust-install` runs `maturin develop` over
  # each crate in the workspace. See docs/adr/0005-rust-core-fork-resolved.md.
  "maturin>=1.7",
]

[project.scripts]
mirage = "mirage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage"]

# torch resolves from the ROCm wheel index that matches the system ROCm (7.2).
[tool.uv.sources]
torch = { index = "rocm" }
torchvision = { index = "rocm" }

[[tool.uv.index]]
name = "rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
files = ["src/mirage", "tests"]

[[tool.mypy.overrides]]
module = [
  "torch.*",
  "transformers.*",
  "diffusers.*",
  "triton.*",
  "triton_kernels.*",
  "flash_attn.*",
  "cosmos_guardrail.*",
  "nltk.*",
  # PyO3-built extensions ship `py.typed` markers but no .pyi stubs, so mypy
  # treats them as Any. Stubs are a future-Stage-3.5 item; for now treat the
  # compiled `_native` submodules like other untyped third-party imports.
  "mirage_cache.*",
  "mirage_router.*",
  "mirage_scheduler.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "TCH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"scripts/*" = ["ANN", "TCH"]
# FastAPI resolves route annotations at runtime (get_type_hints at startup),
# so request/response types cannot live under TYPE_CHECKING here.
"src/mirage/serving/app.py" = ["TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
