# Mirage Rust workspace.
#
# This is intentionally a virtual manifest with no members yet. The polyglot
# scaffold (Cargo + uv + future CMake for kernels) is in place so that when the
# Rust-core fork is resolved (see docs/adr/0004), populating the workspace is
# adding a crate, not standing up build tooling under deadline.
#
# Why this exists:
#   The handoff doc (~/Mirage_Cowork_Handoff.md, "Language stack" section) names
#   Rust for the Runtime core's scheduler, request router, and paged latent-cache
#   manager — with Python bindings via PyO3 — to share one core between the
#   datacenter API and any deterministic-latency edge path.
#
# What lives here when populated:
#   crates/mirage-cache       — paged latent-cache manager (PyO3-bound)
#   crates/mirage-scheduler   — request scheduler (new component)
#   crates/mirage-router      — per-request orchestration (split from FastAPI)
#
# What does NOT live here:
#   - Triton / CUDA kernels → kernels/ (separate codebase, different rules; see
#     handoff "Mixing clean-architecture and perf code produces clean-but-slow
#     or fast-but-unmaintainable").
#   - Python surface (model loading, denoise loop, serving, CLI) → src/mirage/.

[workspace]
members  = []
resolver = "3"

[workspace.package]
version    = "0.0.1"
edition    = "2024"
license    = "Apache-2.0"
repository = "https://github.com/miteshs/Mirage"
authors    = ["Mirage"]
rust-version = "1.85"

# Shared dep versions go here when the first crate lands. Kept empty for now so
# `cargo metadata` on the virtual manifest stays trivial.
[workspace.dependencies]

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
debug         = "line-tables-only"
